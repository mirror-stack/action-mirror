name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is in the matrix because this package READS AND WRITES LEDGER FILES.
    # The seal-lookup reads bytes and splits lines itself, so universal-newline
    # translation no longer happens for it — a CR-only ledger parsed as one line
    # and the lookup answered GENESIS, which on append would have written a second
    # genesis entry into the middle of a live chain. Nothing in a Linux-only matrix
    # could have shown that. A tamper-evidence tool cannot have an unmeasured OS.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with test extras)
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest -v
      - name: Dogfood — action-mirror runs its own example
        run: python examples/demo_family.py

  package:
    # Build the wheel and exercise it in a CLEAN env — catches "works in the
    # repo, broken on pip install" (missing modules / data files / import errors).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Show what the wheel actually ships
        run: python -m zipfile -l dist/*.whl
      - name: Install ONLY the built wheel (no source tree)
        run: pip install dist/*.whl
      - name: Smoke-test the installed package (run from /tmp, not the repo)
        run: cd /tmp && python -c "import actmirror; print('installed import OK:', actmirror.__name__)"
